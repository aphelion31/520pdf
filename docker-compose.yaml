services:
  app:
    build:
      context: .
      dockerfile: docker/axum/Dockerfile
    image: 520pdf-app:1.1.0
    ports:
      - "127.0.0.1:8520:8080"
    env_file: .env
    environment:
      BIND_ADDR: 0.0.0.0:8080
      TMPDIR: /tmp/pdf520
      DATA_DIR: /var/lib/520pdf
    read_only: true
    volumes:
      - pdf520_data:/var/lib/520pdf
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g,uid=1001,gid=1001,mode=1777
      - /home/circleit:rw,noexec,nosuid,size=128m,uid=1001,gid=1001,mode=700
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    init: true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8080/health]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [pdf520]
networks:
  pdf520:
    driver: bridge
volumes:
  pdf520_data:
