worker_processes 2;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # PDF output is already compressed; gzip only the small text responses.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain application/json;

    limit_req_zone $binary_remote_addr zone=docs_login:1m rate=5r/m;

    server {
        listen 80;
        server_name localhost;

        # Match MAX_UPLOAD_MB (50) + multipart overhead; app returns 413 itself.
        client_max_body_size 55m;

        location /docs {
            limit_req zone=docs_login burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://axum:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location / {
            proxy_pass http://axum:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # Compression may take up to JOB_TIMEOUT_SECS (120) + queue wait.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
