[package]
name = "pdf520"
version = "0.2.1"
edition = "2024"
description = "520pdf: single-binary Rust Axum + React Router PDF workbench & rewrite of iHatePDF"
license = "MIT"

[[bin]]
name = "pdf520"
path = "src/main.rs"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
hmac = "0.12"
lopdf = "0.47"
mozjpeg = "0.10"
pdf-writer = "0.15"
rand = "0.8"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "compression-br", "set-header"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
